<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기출 모음</title>
<style>
  :root { --ink:#1d2433; --sub:#5b6476; --line:#e2e5eb; --bg:#f6f7f9; --acc:#2f5bd3; --acc-bg:#e8eefc; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:18px 20px; }
  header h1 { margin:0; font-size:20px; letter-spacing:-.3px; }
  header p { margin:4px 0 0; color:var(--sub); font-size:13px; }
  main { max-width:760px; margin:0 auto; padding:16px 16px 140px; }
  section { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  h2 { font-size:15px; margin:0 0 10px; display:flex; justify-content:space-between; align-items:center; }
  h2 small { font-weight:400; color:var(--sub); font-size:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:7px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 13px; font-size:14px; cursor:pointer; user-select:none; }
  .chip.on { background:var(--acc-bg); border-color:var(--acc); color:var(--acc); font-weight:600; }
  .group-label { font-size:12px; color:var(--sub); margin:10px 0 6px; }
  .quick { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
  .quick button, .link { border:none; background:none; color:var(--acc); font-size:13px; cursor:pointer; padding:2px 4px; }
  input[type=text] { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:12px 16px; }
  .bar .in { max-width:760px; margin:0 auto; display:flex; align-items:center; gap:12px; }
  .bar .count { flex:1; font-size:14px; color:var(--sub); }
  .bar .count b { color:var(--ink); font-size:18px; }
  .go { background:var(--acc); color:#fff; border:none; border-radius:10px; padding:12px 20px; font-size:15px; font-weight:600; cursor:pointer; }
  .go:disabled { opacity:.45; cursor:default; }
  #result { display:none; }
  #result a { display:block; text-align:center; padding:12px; margin-top:8px; border-radius:10px; background:var(--acc-bg); color:var(--acc); font-weight:600; text-decoration:none; }
  .note { font-size:12px; color:var(--sub); margin-top:8px; }
  .muted { color:var(--sub); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>기출 모음</h1>
  <p>조건을 고르면 문제 PDF와 해설 PDF를 만들어 준다.</p>
</header>
<main>
  <section>
    <h2>과목 <small>여러 개 선택 가능</small></h2>
    <div id="subjects" class="chips"></div>
  </section>
  <section id="unitBox" style="display:none">
    <h2>범위(단원) <small>고르지 않으면 전체</small></h2>
    <div id="units"></div>
  </section>
  <section>
    <h2>학년 <small>고르지 않으면 전체</small></h2>
    <div id="grades" class="chips"></div>
  </section>
  <section>
    <h2>연도 <small>시행 연도 기준</small></h2>
    <div class="quick" id="quickYears"></div>
    <div id="years" class="chips"></div>
  </section>
  <section>
    <h2>월 <small>고르지 않으면 전체</small></h2>
    <div id="months" class="chips"></div>
  </section>
  <section>
    <h2>시험 종류 <small>고르지 않으면 전체</small></h2>
    <div id="types" class="chips"></div>
  </section>
  <section>
    <h2>문제집 설정</h2>
    <input type="text" id="title" placeholder="문제집 제목 (기본: 기출 문제집)">
    <div class="group-label">정렬</div>
    <div id="sort" class="chips">
      <span class="chip on" data-v="exam">최신 시험 순</span>
      <span class="chip" data-v="unit">단원 순</span>
    </div>
  </section>
  <section id="result">
    <h2>완성</h2>
    <div id="resultText" class="muted"></div>
    <a id="dlQ" href="#">문제 PDF 받기</a>
    <a id="dlE" href="#">해설 PDF 받기</a>
  </section>
</main>
<div class="bar"><div class="in">
  <div class="count" id="count">과목을 골라 주세요</div>
  <button class="go" id="go" disabled>PDF 만들기</button>
</div></div>
<script>
const sel = { subjects:new Set(), units:new Set(), grades:new Set(), years:new Set(), months:new Set(), types:new Set() };
let opts = null, sort = "exam";

function chip(label, set, value, onChange) {
  const el = document.createElement("span");
  el.className = "chip" + (set.has(value) ? " on" : "");
  el.textContent = label;
  el.onclick = () => { set.has(value) ? set.delete(value) : set.add(value); el.classList.toggle("on"); onChange && onChange(); refresh(); };
  return el;
}
function fill(id, list, set, labelFn, onChange) {
  const box = document.getElementById(id); box.innerHTML = "";
  list.forEach(v => box.appendChild(chip(labelFn ? labelFn(v) : String(v), set, v, onChange)));
}
function renderUnits() {
  const box = document.getElementById("units"); box.innerHTML = "";
  let any = false;
  [...sel.subjects].forEach(s => {
    const us = (opts.units || {})[s];
    if (!us || !us.length) return;
    any = true;
    const lab = document.createElement("div"); lab.className = "group-label"; lab.textContent = s; box.appendChild(lab);
    const c = document.createElement("div"); c.className = "chips";
    us.forEach(u => c.appendChild(chip(u, sel.units, s + "|" + u)));
    box.appendChild(c);
  });
  document.getElementById("unitBox").style.display = any ? "" : "none";
}
function payload() {
  return {
    subjects:[...sel.subjects], grades:[...sel.grades], years:[...sel.years], months:[...sel.months],
    types:[...sel.types], units:[...sel.units].map(x => x.split("|")[1]), sort,
    title: document.getElementById("title").value
  };
}
let timer = null;
function refresh() {
  document.getElementById("result").style.display = "none";
  clearTimeout(timer);
  timer = setTimeout(async () => {
    if (!sel.subjects.size) { document.getElementById("count").textContent = "과목을 골라 주세요"; document.getElementById("go").disabled = true; return; }
    const r = await fetch("/api/count", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload()) });
    const j = await r.json();
    document.getElementById("count").innerHTML = `<b>${j.count}</b> 문항`;
    document.getElementById("go").disabled = j.count === 0;
  }, 150);
}
function quickYears(n) {
  // n개년: 올해를 1년째로 세어 n개 연도의 1월 1일 이후 시행분
  const now = new Date().getFullYear();
  sel.years.clear();
  opts.years.forEach(y => { if (y > now - n) sel.years.add(y); });
  fill("years", opts.years, sel.years, y => y + "년");
  refresh();
}
async function init() {
  opts = await (await fetch("/api/options")).json();
  fill("subjects", opts.subjects.map(s => s.name), sel.subjects, null, renderUnits);
  fill("grades", opts.grades, sel.grades);
  fill("years", opts.years, sel.years, y => y + "년");
  fill("months", opts.months, sel.months, m => m + "월");
  fill("types", opts.types.map(t => t.key), sel.types, k => opts.types.find(t => t.key === k).name);
  const q = document.getElementById("quickYears");
  [1,2,3,5].forEach(n => { const b = document.createElement("button"); b.textContent = n + "개년"; b.onclick = () => quickYears(n); q.appendChild(b); });
  const clr = document.createElement("button"); clr.textContent = "선택 해제"; clr.onclick = () => { sel.years.clear(); fill("years", opts.years, sel.years, y => y + "년"); refresh(); }; q.appendChild(clr);
  document.querySelectorAll("#sort .chip").forEach(el => el.onclick = () => {
    document.querySelectorAll("#sort .chip").forEach(x => x.classList.remove("on")); el.classList.add("on"); sort = el.dataset.v; });
}
document.getElementById("go").onclick = async () => {
  const b = document.getElementById("go"); b.disabled = true; b.textContent = "만드는 중…";
  try {
    const r = await fetch("/api/build", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload()) });
    const j = await r.json();
    if (!r.ok) { alert(j.error || "실패했습니다"); return; }
    document.getElementById("dlQ").href = j.problem;
    document.getElementById("dlE").href = j.solution;
    document.getElementById("resultText").textContent = `${j.count}문항` + (j.no_explanation ? ` · 해설 없는 문항 ${j.no_explanation}개(정답만 표시)` : "");
    document.getElementById("result").style.display = "block";
    document.getElementById("result").scrollIntoView({ behavior:"smooth" });
  } finally { b.disabled = false; b.textContent = "PDF 만들기"; }
};
init();
</script>
</body>
</html>
