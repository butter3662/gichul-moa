<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기출모아</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="기출모아">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1e3a8a">
<style>
  :root { --ink:#1d2433; --sub:#5b6476; --line:#e2e5eb; --bg:#f6f7f9; --acc:#2f5bd3; --acc-bg:#e8eefc; --bad:#c0392b; --ok:#1e8449; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  header h1 { margin:0; font-size:20px; letter-spacing:-.3px; }
  header .who { font-size:12px; color:var(--sub); text-align:right; }
  main { max-width:760px; margin:0 auto; padding:16px 16px 150px; }
  section { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  h2 { font-size:15px; margin:0 0 10px; display:flex; justify-content:space-between; align-items:center; }
  h2 small { font-weight:400; color:var(--sub); font-size:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:7px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 13px; font-size:14px; cursor:pointer; user-select:none; }
  .chip.on { background:var(--acc-bg); border-color:var(--acc); color:var(--acc); font-weight:600; }
  .group-label { font-size:12px; color:var(--sub); margin:10px 0 6px; }
  .quick { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
  .quick button, .link { border:none; background:none; color:var(--acc); font-size:13px; cursor:pointer; padding:2px 4px; }
  input[type=text], input[type=email], input[type=password] { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:15px; margin-bottom:8px; }
  .btn { background:var(--acc); color:#fff; border:none; border-radius:10px; padding:12px 18px; font-size:15px; font-weight:600; cursor:pointer; }
  .btn.ghost { background:var(--acc-bg); color:var(--acc); }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn.wide { width:100%; }
  .tabs { display:flex; gap:6px; margin:0 0 14px; background:var(--card, #fff); border-radius:14px; padding:5px; border:1px solid var(--line, #e3e6ee); }
  .tab { flex:1; text-align:center; padding:10px 0; border-radius:10px; cursor:pointer; font-weight:600; color:var(--sub); }
  .tab.on { background:var(--acc); color:#fff; }
  .note { font-size:13px; color:var(--sub); margin:10px 0 0; line-height:1.5; }
  .switch { text-align:center; font-size:14px; color:var(--sub); margin:14px 0 0; }
  .switch a { color:var(--acc); font-weight:600; text-decoration:none; }
  .row { display:flex; gap:8px; }
  .row .btn { flex:1; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:12px 16px; }
  .bar .in { max-width:760px; margin:0 auto; display:flex; align-items:center; gap:12px; }
  .bar .count { flex:1; font-size:14px; color:var(--sub); }
  .bar .count b { color:var(--ink); font-size:18px; }
  .muted { color:var(--sub); font-size:13px; }
  .err { color:var(--bad); font-size:13px; min-height:18px; }
  .req { border-top:1px solid var(--line); padding:9px 0; font-size:13px; display:flex; justify-content:space-between; gap:10px; }
  .req:first-child { border-top:none; }
  .st-sent { color:var(--ok); font-weight:600; } .st-failed { color:var(--bad); font-weight:600; } .st-queued, .st-working { color:var(--acc); font-weight:600; }
  .hidden { display:none !important; }
  .sub-label{margin-left:14px;font-size:12px;opacity:.8}
  .sub-chips{margin-left:14px}
  .sub-chips .chip{font-size:13px;padding:5px 10px}
</style>
</head>
<body>
<header>
  <div><h1>기출모아</h1><div class="muted">원하는 조건을 고르시면 문제지와 해설지 PDF를 이메일로 보내 드려요</div></div>
  <div class="who" id="who"></div>
</header>
<main>
  <!-- 로그인 -->
  <section id="loginBox" class="hidden">
    <h2>로그인</h2>
    <input type="email" id="lEmail" placeholder="이메일" autocomplete="email">
    <input type="password" id="lPw" placeholder="비밀번호" autocomplete="current-password">
    <div class="err" id="lErr"></div>
    <button class="btn wide" id="btnLogin">로그인</button>
    <p class="switch">아직 계정이 없으신가요? <a href="#" id="toSignup">회원가입</a></p>
  </section>

  <section id="signupBox" class="hidden">
    <h2>회원가입</h2>
    <input type="email" id="sEmail" placeholder="이메일" autocomplete="email">
    <input type="password" id="sPw" placeholder="비밀번호 (6자 이상)" autocomplete="new-password">
    <input type="password" id="sPw2" placeholder="비밀번호 확인" autocomplete="new-password">
    <div class="err" id="sErr"></div>
    <button class="btn wide" id="btnSignup">가입하기</button>
    <p class="switch">이미 계정이 있으신가요? <a href="#" id="toLogin">로그인</a></p>
  </section>

  <div id="app" class="hidden">
    <div class="tabs" id="modeTabs">
      <span class="tab on" data-m="book">문제집 만들기</span>
      <span class="tab" data-m="random">랜덤 한 문제</span>
    </div>
    <div id="randBox" class="hidden">
    <section>
      <h2>영역</h2>
      <div id="rAreas" class="chips"></div>
    </section>
    <section id="rSubjBox" class="hidden">
      <h2>과목</h2>
      <div id="rSubjects" class="chips"></div>
    </section>
    <section>
      <h2>학년</h2>
      <div id="rGrades" class="chips"></div>
    </section>
    <section>
      <h2>받을 곳</h2>
      <input type="email" id="rEmail" placeholder="문제를 받을 이메일">
    </section>
    </div>
    <div id="bookBox">
    <section>
      <h2>영역</h2>
      <div id="areas" class="chips"></div>
    </section>
    <section id="subjBox" class="hidden">
      <h2>과목</h2>
      <div id="subjects" class="chips"></div>
    </section>
    <div id="rest" class="hidden">
    <section id="unitBox" class="hidden">
      <h2>범위(단원)</h2>
      <div id="units"></div>
    </section>
    <section id="ptsBox" class="hidden">
      <h2>배점</h2>
      <div id="pts" class="chips"></div>
    </section>
    <section>
      <h2>학년</h2>
      <div id="grades" class="chips"></div>
    </section>
    <section>
      <h2>학년도</h2>
      <div class="quick" id="quickYears"></div>
      <div id="years" class="chips"></div>
    </section>
    <section>
      <h2>월</h2>
      <div id="months" class="chips"></div>
    </section>
    <section>
      <h2>시험 종류</h2>
      <div id="types" class="chips"></div>
    </section>
    <section>
      <h2>받을 곳</h2>
      <input type="email" id="toEmail" placeholder="PDF를 받을 이메일">
      <input type="text" id="title" placeholder="문제집 제목 (기본: 기출 문제집)">
      <div class="group-label">정렬</div>
      <div id="sort" class="chips">
        <span class="chip on" data-v="exam">최신 시험 순</span>
        <span class="chip" data-v="unit">단원 순</span>
      </div>
    </section>
    </div>
    </div>
    <section>
      <h2>요청 기록<small><button class="link" id="btnLogout">로그아웃</button></small></h2>
      <div id="reqs" class="muted">아직 요청하신 문제집이 없어요.</div>
    </section>
  </div>
</main>
<div class="bar hidden" id="bar"><div class="in">
  <div class="count" id="count">영역을 골라 주세요</div>
  <button class="btn" id="go" disabled>메일로 받기</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ictjkqbbcaigdvlysdaw.supabase.co";
const SUPABASE_KEY = "sb_publishable_C7jZEKJn_nF2Y3Ngq5f80Q_RA5Wrfux";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let optsP = null;
const sel = { pts:new Set(), subjects:new Set(), units:new Set(), subs:new Set(), grades:new Set(), years:new Set(), months:new Set(), types:new Set() };
let opts = null, sort = "exam", user = null, pollTimer = null, area = null;
// 큰 영역 5개 → 세부 과목 (과목이 하나뿐인 영역은 세부 선택 없이 바로 넘어감)
const AREAS = {
  "국어": ["국어"],
  "수학": ["공통수학1", "공통수학2", "대수", "미적분Ⅰ", "확률과 통계", "미적분Ⅱ", "기하"],
  "영어": ["영어"],
  "통합사회": ["통합사회"],
  "통합과학": ["통합과학"],
  "선택 과학": ["물리학", "화학", "생명과학", "지구과학", "역학과 에너지", "전자기와 양자",
           "화학 반응의 세계", "물질과 에너지", "세포와 물질대사", "생물의 유전", "지구시스템과학", "행성우주과학"],
};
// 배점 선택: 수학 2·3·4점, 선택 과학 2·3점 (통합·국어·영어는 없음)
const PTS = { "수학": [2, 3, 4], "선택 과학": [2, 3] };
function chooseArea(a) {
  area = a; sel.subjects.clear(); sel.units.clear(); sel.subs.clear(); sel.pts.clear();
  if (PTS[a]) { fill("pts", PTS[a], sel.pts, v => v + "점"); $("ptsBox").classList.remove("hidden"); }
  else $("ptsBox").classList.add("hidden");
  document.querySelectorAll("#areas .chip").forEach(x => x.classList.toggle("on", x.dataset.v === a));
  const subs = AREAS[a].filter(s => opts.subjects.includes(s));
  if (subs.length === 1) { sel.subjects.add(subs[0]); $("subjBox").classList.add("hidden"); }
  else { fill("subjects", subs, sel.subjects, null, renderUnits); $("subjBox").classList.remove("hidden"); }
  $("rest").classList.remove("hidden");
  renderUnits(); refresh();
}

function chip(label, set, value, onChange) {
  const el = document.createElement("span");
  el.className = "chip" + (set.has(value) ? " on" : "");
  el.textContent = label;
  el.onclick = () => { set.has(value) ? set.delete(value) : set.add(value); el.classList.toggle("on"); onChange && onChange(); refresh(); };
  return el;
}
function fill(id, list, set, labelFn, onChange) {
  const box = $(id); box.innerHTML = "";
  list.forEach(v => box.appendChild(chip(labelFn ? labelFn(v) : String(v), set, v, onChange)));
}
function renderUnits() {
  const box = $("units"); box.innerHTML = ""; let any = false;
  // 고른 대단원이 아닌 소단원 선택은 지운다
  [...sel.subs].forEach(x => { const p = x.split("/"); if (!sel.units.has(p[0] + "/" + p[1])) sel.subs.delete(x); });
  [...sel.subjects].forEach(s => {
    const us = (opts.units || {})[s]; if (!us || !us.length) return; any = true;
    const lab = document.createElement("div"); lab.className = "group-label"; lab.textContent = s; box.appendChild(lab);
    const c = document.createElement("div"); c.className = "chips";
    us.forEach(u => c.appendChild(chip(u, sel.units, s + "/" + u, renderUnits))); box.appendChild(c);
    us.forEach(u => {
      const key = s + "/" + u, ss = (opts.subs || {})[key];
      if (!sel.units.has(key) || !ss || ss.length < 2) return;
      const l2 = document.createElement("div"); l2.className = "group-label sub-label"; l2.textContent = "└ " + u + " 소단원"; box.appendChild(l2);
      const c2 = document.createElement("div"); c2.className = "chips sub-chips";
      ss.forEach(x => c2.appendChild(chip(x, sel.subs, key + "/" + x))); box.appendChild(c2);
    });
  });
  $("unitBox").classList.toggle("hidden", !any);
}
function count() {
  // combos: [과목들(|로 구분), 학년, 연도, 월, 종류, 단원, 문항수]
  let n = 0;
  for (const [subs, g, y, m, t, u, b, p, c] of opts.combos) {
    if (sel.pts.size && p && !sel.pts.has(p)) continue;
    if (sel.subjects.size && !subs.split("|").some(s => sel.subjects.has(s))) continue;
    if (sel.grades.size && !sel.grades.has(g)) continue;
    const ex = t === "예시";   // 수능 예시문항은 2028학년도를 골랐을 때만
    if (ex && !sel.years.has(2028)) continue;
    if (sel.years.size && !sel.years.has(y)) continue;
    if (!ex && sel.months.size && !sel.months.has(m)) continue;
    if (sel.types.size && !sel.types.has(t)) continue;
    if (sel.units.size) {
      const s0 = subs.split("|")[0];
      const mine = [...sel.units].filter(x => x.startsWith(s0 + "/"));
      if (mine.length && !sel.units.has(s0 + "/" + u)) continue;
    }
    if (sel.subs.size) {
      const pre = subs.split("|")[0] + "/" + u + "/";
      const mine = [...sel.subs].filter(x => x.startsWith(pre));
      if (mine.length && !sel.subs.has(pre + b)) continue;
    }
    n += c;
  }
  return n;
}
// 시험 종류: "수능 예시문항"은 2028학년도를 골랐을 때만 보인다
function renderTypes() {
  const show28 = sel.years.has(2028);
  if (!show28) sel.types.delete("예시");
  fill("types", opts.types.map(t => t.key).filter(k => show28 || k !== "예시"), sel.types, k => opts.types.find(t => t.key === k).name);
}
let _lastY = "";
let mode = "book";
const rsel = { area:null, subjects:new Set(), grades:new Set() };
const RSUBJ = { "국어": ["독서", "문학", "화법과 작문", "언어와 매체"], "수학": null, "영어": [] };
function setMode(m) {
  mode = m;
  document.querySelectorAll("#modeTabs .tab").forEach(t => t.classList.toggle("on", t.dataset.m === m));
  $("bookBox").classList.toggle("hidden", m !== "book"); $("randBox").classList.toggle("hidden", m !== "random");
  if (m === "random" && !$("rEmail").value) $("rEmail").value = $("toEmail").value || (user && user.email) || "";
  refresh();
}
document.querySelectorAll("#modeTabs .tab").forEach(t => t.onclick = () => setMode(t.dataset.m));
function rChooseArea(a) {
  rsel.area = a; rsel.subjects.clear();
  document.querySelectorAll("#rAreas .chip").forEach(x => x.classList.toggle("on", x.dataset.v === a));
  const list = RSUBJ[a] === null ? AREAS["수학"].filter(s => opts.subjects.includes(s)) : RSUBJ[a];
  if (list.length) { fill("rSubjects", list, rsel.subjects); $("rSubjBox").classList.remove("hidden"); }
  else $("rSubjBox").classList.add("hidden");
  refresh();
}
function initRandom() {
  const box = $("rAreas"); box.innerHTML = "";
  ["국어", "수학", "영어"].forEach(a => { const el = document.createElement("span"); el.className = "chip"; el.dataset.v = a; el.textContent = a; el.onclick = () => rChooseArea(a); box.appendChild(el); });
  fill("rGrades", ["고1", "고2", "고3"], rsel.grades);
}
function refresh() {
  if (mode === "random") {
    $("count").textContent = rsel.area ? `랜덤 ${rsel.area} 1문제` + (rsel.area === "국어" ? " (지문 단위)" : rsel.area === "수학" ? " (4점)" : "") : "영역을 골라 주세요";
    $("go").disabled = !rsel.area; return;
  }
  const yk = sel.years.has(2028) ? "1" : "0";
  if (yk !== _lastY) { _lastY = yk; renderTypes(); }
  if (!sel.subjects.size) { $("count").textContent = area ? "과목을 골라 주세요" : "영역을 골라 주세요"; $("go").disabled = true; return; }
  const n = count();
  $("count").innerHTML = `<b>${n}</b> 문항` + (n > opts.max_items ? ` <span style="color:var(--bad)">(최대 ${opts.max_items})</span>` : "");
  $("go").disabled = n === 0 || n > opts.max_items;
}
function quickYears(n) {
  // n개년: 올해를 1년째로 세어 n개 연도의 1월 1일 이후 시행분
  const top = Math.max(...opts.years.filter(y => y < 2028)); sel.years.clear();
  opts.years.forEach(y => { if (y > top - n) sel.years.add(y); });
  fill("years", opts.years, sel.years, y => y + "학년도"); refresh();
}
function payload() {
  return { subjects:[...sel.subjects], grades:[...sel.grades], years:[...sel.years], months:[...sel.months],
           types:[...sel.types], units:[...sel.units], subs:[...sel.subs], pts:[...sel.pts], sort, title: $("title").value.trim() };
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ST = { queued:"기다리는 중", working:"만드는 중", sent:"보냈어요", failed:"실패했어요" };
async function loadReqs() {
  const { data, error } = await sb.from("gichul_requests").select("id,email,query,status,message,item_count,created_at").gte("created_at", new Date(Date.now() - 864e5).toISOString()).order("created_at", { ascending:false }).limit(10);
  if (error) { $("reqs").textContent = "기록을 불러오지 못했어요. 잠시 후 다시 시도해 주세요."; return; }
  if (!data.length) { $("reqs").textContent = "아직 요청하신 문제집이 없어요."; return; }
  $("reqs").innerHTML = "";
  let pending = false;
  data.forEach(r => {
    if (r.status === "queued" || r.status === "working") pending = true;
    const d = new Date(r.created_at);
    const subj = r.query.mode === "random" ? `랜덤 ${r.query.area || ""}` + ((r.query.subjects || []).length ? " · " + r.query.subjects.join(", ") : "") : (r.query.subjects || []).join(", ");
    const el = document.createElement("div"); el.className = "req";
    el.innerHTML = `<div><div>${esc(subj) || "-"}${r.item_count != null ? ` · ${r.item_count}문항` : ""}</div>
      <div class="muted">${esc(d.toLocaleString("ko-KR"))} → ${esc(r.email)}${r.message ? "<br>" + esc(r.message) : ""}</div></div>
      <div class="st-${esc(r.status)}">${esc(ST[r.status] || r.status)}</div>`;
    $("reqs").appendChild(el);
  });
  clearTimeout(pollTimer);
  if (pending) pollTimer = setTimeout(loadReqs, 5000);
}
async function showApp() {
  $("loginBox").classList.add("hidden"); $("signupBox").classList.add("hidden"); $("app").classList.remove("hidden"); $("bar").classList.remove("hidden");
  $("who").textContent = user.email;
  if (!$("toEmail").value) $("toEmail").value = user.email;
  if (!opts) {
    // 로그인 상태 알림이 여러 번 와도 선택지는 한 번만 만든다
    optsP = optsP || fetch("options.json").then(r => r.json());
    const o = await optsP;
    if (opts) { loadReqs(); return; }
    opts = o;
    const ab = $("areas"); ab.innerHTML = "";
    Object.keys(AREAS).forEach(a => { const el = document.createElement("span"); el.className = "chip"; el.dataset.v = a;
      el.textContent = a; el.onclick = () => chooseArea(a); ab.appendChild(el); });
    fill("grades", opts.grades, sel.grades);
    fill("years", opts.years, sel.years, y => y + "학년도");
    fill("months", opts.months, sel.months, m => m + "월");
    renderTypes(); initRandom();
    const q = $("quickYears"); q.innerHTML = "";
    [1,2,3,5].forEach(n => { const b = document.createElement("button"); b.textContent = n + "개년"; b.onclick = () => quickYears(n); q.appendChild(b); });
    const clr = document.createElement("button"); clr.textContent = "선택 해제";
    clr.onclick = () => { sel.years.clear(); fill("years", opts.years, sel.years, y => y + "학년도"); refresh(); }; q.appendChild(clr);
    document.querySelectorAll("#sort .chip").forEach(el => el.onclick = () => {
      document.querySelectorAll("#sort .chip").forEach(x => x.classList.remove("on")); el.classList.add("on"); sort = el.dataset.v; });
  }
  loadReqs();
}
function showLogin() {
  $("app").classList.add("hidden"); $("bar").classList.add("hidden"); $("signupBox").classList.add("hidden");
  $("loginBox").classList.remove("hidden"); $("who").textContent = "";
}
function showSignup() {
  $("loginBox").classList.add("hidden"); $("signupBox").classList.remove("hidden");
  $("sEmail").value = $("lEmail").value; $("sErr").textContent = "";
}
$("toSignup").onclick = e => { e.preventDefault(); showSignup(); };
$("toLogin").onclick = e => { e.preventDefault(); $("lEmail").value = $("sEmail").value; $("lErr").textContent = ""; showLogin(); };
function authMsg(m) {
  if (/already registered|already been registered/i.test(m)) return "이미 가입된 이메일이에요. 로그인해 주세요.";
  if (/at least 6/i.test(m)) return "비밀번호는 6자 이상이어야 해요.";
  if (/invalid.*email|email.*invalid/i.test(m)) return "이메일 주소를 확인해 주세요.";
  if (/rate limit|too many/i.test(m)) return "요청이 너무 많아요. 잠시 후 다시 시도해 주세요.";
  return m;
}
$("btnLogin").onclick = async () => {
  $("lErr").textContent = "";
  const { data, error } = await sb.auth.signInWithPassword({ email:$("lEmail").value.trim(), password:$("lPw").value });
  if (error) { $("lErr").textContent = /not confirmed/i.test(error.message) ? "가입 확인 메일의 링크를 먼저 눌러 주세요." : "로그인하지 못했어요. 이메일과 비밀번호를 확인해 주세요."; return; }
  user = data.user; showApp();
};
$("lPw").addEventListener("keydown", e => { if (e.key === "Enter") $("btnLogin").click(); });
$("btnSignup").onclick = async () => {
  const err = $("sErr"); err.textContent = "";
  const email = $("sEmail").value.trim(), pw = $("sPw").value;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = "이메일 주소를 확인해 주세요."; return; }
  if (pw.length < 6) { err.textContent = "비밀번호는 6자 이상이어야 해요."; return; }
  if (pw !== $("sPw2").value) { err.textContent = "비밀번호가 서로 달라요."; return; }
  const b = $("btnSignup"); b.disabled = true;
  const { data, error } = await sb.auth.signUp({ email, password:pw, options:{ emailRedirectTo: location.origin + location.pathname } });
  b.disabled = false;
  if (error) { err.textContent = authMsg(error.message); return; }
  if (data.session) { user = data.user; $("signupBox").classList.add("hidden"); showApp(); }
  else err.textContent = "가입 확인 메일을 보내 드렸어요. 메일의 링크를 누른 뒤 로그인해 주세요.";
};
$("sPw2").addEventListener("keydown", e => { if (e.key === "Enter") $("btnSignup").click(); });
$("btnLogout").onclick = async () => { await sb.auth.signOut(); user = null; showLogin(); };
$("go").onclick = async () => {
  if (mode === "random") {
    const to = $("rEmail").value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)) { alert("받으실 이메일 주소를 확인해 주세요."); return; }
    const b = $("go"); b.disabled = true; b.textContent = "요청하는 중…";
    const q = { mode:"random", area:rsel.area, subjects:[...rsel.subjects], grades:[...rsel.grades] };
    const { error } = await sb.from("gichul_requests").insert({ email:to, query:q });
    b.textContent = "메일로 받기"; refresh();
    if (error) { alert(error.message.includes("한도") ? error.message : "요청하지 못했어요: " + error.message); return; }
    loadReqs(); $("reqs").scrollIntoView({ behavior:"smooth" }); return;
  }
  const to = $("toEmail").value.trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)) { alert("받으실 이메일 주소를 확인해 주세요."); return; }
  const b = $("go"); b.disabled = true; b.textContent = "요청하는 중…";
  const { error } = await sb.from("gichul_requests").insert({ email:to, query:payload() });
  b.textContent = "메일로 받기"; refresh();
  if (error) { alert(error.message.includes("한도") ? error.message : "요청하지 못했어요: " + error.message); return; }
  loadReqs();
  $("reqs").scrollIntoView({ behavior:"smooth" });
};
(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) { user = data.session.user; showApp(); } else showLogin();
})();
</script>
</body>
